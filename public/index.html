<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Folha → Drive</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --muted:#94a3b8; --acc:#38bdf8; --ok:#22c55e; --err:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
    main { max-width: 560px; margin: 0 auto; padding: 16px 0 40px; }
    h1 { font-size: 1.35rem; margin: 8px 0 16px; }
    section { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
    section[hidden] { display:none; }
    h2 { font-size: 1rem; margin:0 0 12px; color: var(--acc); }
    label { display:block; font-size:.85rem; color:var(--muted); margin: 10px 0 4px; }
    input, textarea, select { width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0b1222; color:var(--txt); font-size:1rem; }
    textarea { min-height: 160px; resize: vertical; font-family: inherit; }
    button { width:100%; padding:14px; margin-top:12px; border:0; border-radius:12px; background:var(--acc); color:#0b1222; font-weight:700; font-size:1rem; cursor:pointer; }
    button.secondary { background:#334155; color:var(--txt); }
    button.danger { background:#7f1d1d; color:var(--txt); }
    button:disabled { opacity:.5; }
    .status { margin-top:10px; font-size:.9rem; white-space: pre-wrap; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #334155; font-size:.9rem; }
    .row button { width:auto; margin:0; padding:6px 10px; font-size:.8rem; }
    small { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>📄 Folha → Google Drive</h1>

  <!-- Login -->
  <section id="secLogin">
    <h2>Entrar</h2>
    <label for="loginUser">Usuário ou e-mail</label>
    <input id="loginUser" autocomplete="username">
    <label for="loginSenha">Senha</label>
    <input id="loginSenha" type="password" autocomplete="current-password">
    <button id="btnLogin">Entrar</button>
    <div id="loginStatus" class="status"></div>
    <small>Versão: scanner-v8 (f49a26b)</small>
  </section>

  <!-- Área logada -->
  <div id="area" hidden>
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <small id="quem"></small>
        <button id="btnSair" class="secondary" style="width:auto;margin:0;padding:6px 12px">Sair</button>
      </div>
    </section>

    <section>
      <h2>1. Foto dos recibos</h2>
      <label for="photo">Foto (tire reta, de frente, com boa luz)</label>
      <input id="photo" type="file" accept="image/*" capture="environment">
      <label for="rotate">Girar a foto</label>
      <select id="rotate">
        <option value="0">Sem giro</option>
        <option value="90">90° horário</option>
        <option value="270">90° anti-horário</option>
        <option value="180">180°</option>
      </select>
      <small>Use o giro se o texto aparecer de lado ou de cabeça para baixo.</small>
      <div id="ajusteBox" hidden>
        <label>Cantos da página (arraste se a detecção errar)</label>
        <canvas id="editor" style="width:100%;touch-action:none;border-radius:10px;background:#000;display:block"></canvas>
        <button id="btnDetect" class="secondary" disabled>Detectar página de novo</button>
        <button id="btnGerar" disabled>Gerar página escaneada</button>
        <label>Prévia da página escaneada</label>
        <img id="preview" alt="" style="width:100%;border-radius:10px;background:#fff;display:none">
      </div>
      <button id="btnOcr" class="secondary" disabled>Ler nomes da folha (OCR)</button>
      <div id="ocrStatus" class="status"></div>
    </section>

    <section>
      <h2>2. Pessoas e setores (confira e corrija)</h2>
      <label for="eventName">Nome do evento (vai no nome de cada pasta)</label>
      <input id="eventName" placeholder="Ex.: PRÉ CAJU - 2026">
      <label for="names">Uma pessoa por linha</label>
      <textarea id="names" placeholder="FLAVIO LUIS ROSA BEZERRA&#10;MARIA SILVA"></textarea>
      <button id="btnCreate" disabled>Criar pastas e enviar ao Drive</button>
      <div id="driveStatus" class="status"></div>
    </section>

    <!-- Administração: só o admin master vê -->
    <section id="secAdmin" hidden>
      <h2>Contas da equipe</h2>
      <div id="listaUsuarios"></div>
      <label for="novoUser">Novo usuário</label>
      <input id="novoUser" autocomplete="off" placeholder="ex.: joao.silva">
      <label for="novoEmail">E-mail (opcional)</label>
      <input id="novoEmail" type="email" autocomplete="off">
      <label for="novaSenha">Senha inicial (mínimo 8 caracteres)</label>
      <input id="novaSenha" type="password" autocomplete="new-password">
      <button id="btnNovo">Criar conta</button>
      <div id="adminStatus" class="status"></div>
    </section>
  </div>
</main>
<script src="scanner.js" defer></script>
<script src="app.js" defer></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
